name: Along integration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test --workspace @concierge/backend
      - run: npm test --workspace @coupang/agent
      - run: npm test --workspace @along/shopper
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @along/shopper
      - run: npm run test:canvas -w @along/shopper
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            apps/shopper/test-results/
            test-results/
