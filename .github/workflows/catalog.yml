name: Catalog acceptance
on:
  pull_request:
    paths: ['catalog/**', '.github/workflows/catalog.yml']
  push:
    branches: [main]
    paths: ['catalog/**', '.github/workflows/catalog.yml']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: catalog/package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: Generated fixtures match source
        run: git diff --exit-code -- data/
