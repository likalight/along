services:
  along-shopper:
    container_name: along-shopper
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ALONG_PORT:-3000}:3000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALONG_DISCOVERY_PROVIDER: ${ALONG_DISCOVERY_PROVIDER:-}
      COUPANG_PARTNERS_APPROVED: ${COUPANG_PARTNERS_APPROVED:-false}
      COUPANG_ACCESS_KEY: ${COUPANG_ACCESS_KEY:-}
      COUPANG_SECRET_KEY: ${COUPANG_SECRET_KEY:-}
      COUPANG_SEARCH_PATH: ${COUPANG_SEARCH_PATH:-}
      ALONG_DISCOVERY_VISION: ${ALONG_DISCOVERY_VISION:-false}
      ALONG_DISCOVERY_VISION_MODEL: ${ALONG_DISCOVERY_VISION_MODEL:-gpt-4.1-mini}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
